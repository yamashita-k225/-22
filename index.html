<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>積み込み確認</title>
<style>
  :root { --base:#1c1f24; --ok:#1f9d55; --ng:#d63a3a; --over:#e0a100; --text:#f4f4f2; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { background:var(--base); color:var(--text);
    font-family:"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
    display:flex; flex-direction:column; transition:background .15s; }
  body.ok { background:var(--ok); }
  body.ng { background:var(--ng); }
  body.over { background:var(--over); color:#222; }
  body.ng #mark { font-size:48px; }
  header { padding:12px 16px; display:flex; gap:8px; align-items:center; }
  header label { font-size:14px; }
  header input { flex:1; font-size:18px; padding:8px; border-radius:6px; border:0; }
  #cam { position:relative; width:100%; max-width:480px; margin:0 auto; display:none; }
  #video { width:100%; display:block; background:#000; }
  #guide { position:absolute; left:6%; right:6%; top:50%; height:0;
    border-top:3px solid rgba(255,60,60,.85); pointer-events:none; }
  #result { flex:1; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:16px; }
  #mark { font-size:96px; font-weight:700; line-height:1.1; }
  #name { font-size:22px; margin-top:8px; }
  #count { font-size:40px; font-weight:700; margin-top:8px; }
  .manual { display:flex; gap:8px; padding:0 16px 8px; }
  .manual input { flex:1; font-size:18px; padding:10px; border-radius:6px; border:0; }
  button { font-size:16px; padding:10px 16px; border-radius:6px; border:0; }
  #start { margin:0 16px 16px; }
</style>
</head>
<body>
<header>
  <label for="course">コース</label>
  <input id="course" value="池袋">
</header>
<div id="cam">
  <video id="video" playsinline muted autoplay></video>
  <div id="guide"></div>
</div>
<div id="result">
  <div id="mark">待機中</div>
  <div id="name">バーコードにカメラを向けてください</div>
  <div id="count"></div>
</div>
<div class="manual">
  <input id="manual" type="tel" inputmode="numeric" placeholder="読めないときはJANを手入力">
  <button id="manualBtn">確認</button>
</div>
<button id="start">カメラを開始</button>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
// ★Apps Scriptのウェブアプリ URL（/exec で終わるもの）
const API_URL = "https://script.google.com/macros/s/AKfycbzcnbxYctMOYa07qkPmSprKMhA4iSbN5mwnJqrd6Hc5OkIdk6ia79R7OSxlUhg45Xyn/exec";

const courseEl = document.getElementById("course");
try { courseEl.value = localStorage.getItem("course") || courseEl.value; } catch (e) {}
courseEl.addEventListener("change", () => {
  try { localStorage.setItem("course", courseEl.value); } catch (e) {}
});

const body = document.body;
const markEl = document.getElementById("mark");
const nameEl = document.getElementById("name");
const countEl = document.getElementById("count");

let busy = false;
let lastJan = "", lastTime = 0;

function show(cls, mark, name, count) {
  body.className = cls;
  markEl.textContent = mark;
  nameEl.textContent = name || "";
  countEl.textContent = count || "";
  if (navigator.vibrate) navigator.vibrate(cls === "ok" ? 80 : [150, 80, 150]);
}

// JAN(EAN)のチェックデジットを確認する。読み間違いを弾くため。
function validJan(s) {
  if (!/^(\d{8}|\d{12}|\d{13})$/.test(s)) return false;
  const d = s.split("").map(Number);
  const chk = d.pop();
  let sum = 0;
  d.reverse().forEach((n, i) => { sum += (i % 2 === 0) ? n * 3 : n; });
  return (10 - (sum % 10)) % 10 === chk;
}

async function onScan(jan, manual) {
  if (!validJan(jan)) {
    if (manual) show("ng", "JANが違います", "桁数か数字を確認してください", jan);
    return; // カメラの読み間違いは無視して、次の読み取りを待つ
  }
  const now = Date.now();
  if (busy || (jan === lastJan && now - lastTime < 2000)) return;
  busy = true; lastJan = jan; lastTime = now;
  try {
    const url = API_URL + "?course=" + encodeURIComponent(courseEl.value) +
                "&jan=" + encodeURIComponent(jan);
    const r = await (await fetch(url)).json();
    if (r.result === "OK") {
      show("ok", "OK", r.name, r.done + " / " + r.plan);
    } else if (r.result === "OVER") {
      show("over", "多い", r.name, r.done + " / " + r.plan + "（予定数を超えます）");
    } else {
      show("ng", "商品が違います", "このコースの商品ではありません", jan);
    }
  } catch (e) {
    show("ng", "通信エラー", "電波を確認して、もう一度読み取ってください", "");
  }
  setTimeout(() => { busy = false; }, 800);
}

// 手入力
document.getElementById("manualBtn").addEventListener("click", () => {
  const el = document.getElementById("manual");
  const v = el.value.replace(/\s/g, "");
  if (v) { onScan(v, true); el.value = ""; }
});

// カメラ
document.getElementById("start").addEventListener("click", async () => {
  if (!window.ZXing) {
    show("ng", "読込エラー", "読み取り部品を取得できません。電波を確認してください", "");
    return;
  }
  const hints = new Map();
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,
            [ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8]);
  hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
  const reader = new ZXing.BrowserMultiFormatReader(hints, 150);
  document.getElementById("cam").style.display = "block";
  try {
    await reader.decodeFromConstraints(
      { video: { facingMode: { ideal: "environment" },
                 width: { ideal: 1920 }, height: { ideal: 1080 } } },
      "video",
      (result) => { if (result) onScan(result.getText(), false); }
    );
    document.getElementById("start").style.display = "none";
  } catch (e) {
    document.getElementById("cam").style.display = "none";
    show("ng", "カメラ不可", "ブラウザのカメラ許可を確認してください", "");
  }
});
</script>
</body>
</html>
