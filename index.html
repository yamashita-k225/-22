<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>積み込み確認</title>
<style>
  :root { --base:#1c1f24; --ok:#1f9d55; --ng:#d63a3a; --over:#e0a100; --text:#f4f4f2; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { background:var(--base); color:var(--text);
    font-family:"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
    display:flex; flex-direction:column; transition:background .15s; }
  body.ok { background:var(--ok); }
  body.ng { background:var(--ng); }
  body.over { background:var(--over); color:#222; }
  body.ng #mark { font-size:48px; }
  header { padding:12px 16px; display:flex; gap:8px; align-items:center; }
  header label { font-size:14px; }
  header input { flex:1; font-size:18px; padding:8px; border-radius:6px; border:0; }
  #reader { width:100%; max-width:480px; margin:0 auto; }
  #result { flex:1; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:16px; }
  #mark { font-size:96px; font-weight:700; line-height:1.1; }
  #name { font-size:22px; margin-top:8px; }
  #count { font-size:40px; font-weight:700; margin-top:8px; }
  .manual { display:flex; gap:8px; padding:0 16px 8px; }
  .manual input { flex:1; font-size:18px; padding:10px; border-radius:6px; border:0; }
  button { font-size:16px; padding:10px 16px; border-radius:6px; border:0; }
  #start { margin:0 16px 16px; }
  .tools { display:none; gap:12px; justify-content:center; align-items:center; padding:6px 16px; }
  .tools input[type=range] { flex:1; }
  #status { text-align:center; font-size:14px; opacity:.85; padding:4px 16px; min-height:24px; }
  /* NG のときは画面いっぱいに大きく出す */
  #overlay { position:fixed; inset:0; z-index:10; display:none; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:24px;
    background:var(--ng); color:#fff; }
  #overlay.show { display:flex; }
  #ovMark { font-size:11vw; font-weight:700; line-height:1.25; word-break:keep-all; }
  #ovName { font-size:5vw; margin-top:16px; }
  #ovCount { font-size:6vw; font-weight:700; margin-top:12px; }
  #ovHint { font-size:3.5vw; margin-top:32px; opacity:.8; }
</style>
</head>
<body>
<header>
  <label for="course">コース</label>
  <input id="course" value="池袋">
</header>
<div id="reader"></div>
<div id="camTools" class="tools">
  <button id="torchBtn" type="button" style="display:none">ライト</button>
  <label id="zoomWrap" style="display:none;flex:1;align-items:center;gap:8px">ズーム <input id="zoom" type="range"></label>
</div>
<div id="status">「カメラを開始」を押してください</div>
<div id="result">
  <div id="mark">待機中</div>
  <div id="name">バーコードにカメラを向けてください</div>
  <div id="count"></div>
</div>
<div class="manual">
  <input id="manual" type="tel" inputmode="numeric" placeholder="読めないときはJANを手入力">
  <button id="manualBtn">確認</button>
</div>
<button id="start">カメラを開始</button>
<div id="overlay">
  <div id="ovMark"></div>
  <div id="ovName"></div>
  <div id="ovCount"></div>
  <div id="ovHint">画面をタップすると閉じます</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
// ★Apps Scriptのウェブアプリ URL（/exec で終わるもの）
const API_URL = "https://script.google.com/macros/s/AKfycbzcnbxYctMOYa07qkPmSprKMhA4iSbN5mwnJqrd6Hc5OkIdk6ia79R7OSxlUhg45Xyn/exec";

const courseEl = document.getElementById("course");
try { courseEl.value = localStorage.getItem("course") || courseEl.value; } catch (e) {}
courseEl.addEventListener("change", () => {
  try { localStorage.setItem("course", courseEl.value); } catch (e) {}
});

const body = document.body;
const markEl = document.getElementById("mark");
const nameEl = document.getElementById("name");
const countEl = document.getElementById("count");

let busy = false;
let lastJan = "", lastReadAt = 0, frames = 0;
const lastSeen = {};   // バーコードごとに「最後に映っていた時刻」
const statusEl = document.getElementById("status");
function setStatus(t) { statusEl.textContent = t; }

const ov = document.getElementById("overlay");
let ovTimer;
function hideOverlay() { ov.classList.remove("show"); }
ov.addEventListener("click", hideOverlay);

function show(cls, mark, name, count) {
  body.className = cls;
  markEl.textContent = mark;
  nameEl.textContent = name || "";
  countEl.textContent = count || "";
  clearTimeout(ovTimer);
  if (cls === "ng") {
    document.getElementById("ovMark").textContent = mark;
    document.getElementById("ovName").textContent = name || "";
    document.getElementById("ovCount").textContent = count || "";
    ov.classList.add("show");
    ovTimer = setTimeout(hideOverlay, 2000);
  } else {
    hideOverlay();
  }
  if (navigator.vibrate) navigator.vibrate(cls === "ok" ? 80 : [150, 80, 150]);
}

// JAN(EAN)のチェックデジットを確認する。読み間違いを弾くため。
function validJan(s) {
  if (!/^(\d{8}|\d{12}|\d{13})$/.test(s)) return false;
  const d = s.split("").map(Number);
  const chk = d.pop();
  let sum = 0;
  d.reverse().forEach((n, i) => { sum += (i % 2 === 0) ? n * 3 : n; });
  return (10 - (sum % 10)) % 10 === chk;
}

async function onScan(jan, manual) {
  lastReadAt = Date.now();
  if (!validJan(jan)) {
    setStatus("読み間違い（無視）: " + jan);
    if (manual) show("ng", "JANが違います", "桁数か数字を確認してください", jan);
    return; // カメラの読み間違いは無視して、次の読み取りを待つ
  }
  setStatus("読み取り: " + jan);
  const now = Date.now();
  const seenPrev = lastSeen[jan] || 0;
  lastSeen[jan] = now;
  if (busy) return;
  // 映したままの同じバーコードは1回しか数えない。
  // いったん1秒以上カメラから外してから映すと、もう1回数える（手入力は常に数える）
  if (!manual && jan === lastJan && now - seenPrev < 1000) return;
  busy = true; lastJan = jan;
  try {
    const url = API_URL + "?course=" + encodeURIComponent(courseEl.value) +
                "&jan=" + encodeURIComponent(jan);
    const r = await (await fetch(url)).json();
    if (r.result === "OK") {
      show("ok", "OK", r.name, r.done + " / " + r.plan);
    } else if (r.result === "OVER") {
      show("over", "多い", r.name, r.done + " / " + r.plan + "（予定数を超えます）");
    } else {
      show("ng", "商品が違います", "このコースの商品ではありません", jan);
    }
  } catch (e) {
    show("ng", "通信エラー", "電波を確認して、もう一度読み取ってください", "");
  }
  setTimeout(() => { busy = false; }, 800);
}

// ===== 高精度の補助読み取り =====
// 画面の標準の読み取りは、枠の中を画面の大きさまで縮めて読むため、細かいバーコードに弱い。
// そこで枠の中を「カメラ本来の細かさ」のまま、もう1つの方法でも読む。
// ==FAST-DECODER-START==
function toLum(rgba, n) {
  // カラー画像を白黒の明るさに変える（試験では、コントラスト補正を足すと逆に読めなくなったため、素直な変換にしている）
  const lum = new Uint8ClampedArray(n);
  for (let i = 0, p = 0; i < n; i++, p += 4) {
    lum[i] = (rgba[p] * 77 + rgba[p + 1] * 151 + rgba[p + 2] * 28) >> 8;
  }
  return lum;
}
function makeZxReader() {
  const hints = new Map();
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,
    [ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8, ZXing.BarcodeFormat.UPC_A]);
  hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
  const r = new ZXing.MultiFormatReader();
  r.setHints(hints);
  return r;
}
function decodeLum(reader, lum, w, h) {
  const src = new ZXing.RGBLuminanceSource(lum, w, h);
  for (const B of [ZXing.HybridBinarizer, ZXing.GlobalHistogramBinarizer]) {
    try { return reader.decodeWithState(new ZXing.BinaryBitmap(new B(src))).getText(); } catch (e) {}
  }
  return null;
}
// ==FAST-DECODER-END==

let fastTimer = null;
function startFastDecoder(onCode) {
  const canNative = ("BarcodeDetector" in window);
  if (!window.ZXing && !canNative) return;
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  let zx = null, det = null;
  try { if (window.ZXing) zx = makeZxReader(); } catch (e) {}
  try { if (canNative) det = new BarcodeDetector({ formats: ["ean_13", "ean_8", "upc_a"] }); } catch (e) {}
  let n = 0;
  const loop = async () => {
    const t0 = performance.now();
    try {
      const video = document.querySelector("#reader video");
      if (video && video.readyState >= 2 && video.videoWidth && video.clientWidth) {
        // 画面の四角い枠と同じ場所を、カメラ本来の細かさで切り出す
        const rw = video.clientWidth, rh = video.clientHeight;
        const bw = rw * 0.92, bh = Math.min(rw, rh) * 0.5;
        const kx = video.videoWidth / rw, ky = video.videoHeight / rh;
        const sx = (rw - bw) / 2 * kx, sy = (rh - bh) / 2 * ky, sw = bw * kx, sh = bh * ky;
        const base = Math.min(1, 1600 / sw);
        const scale = (n++ % 2 === 0) ? base : base * 0.6;   // 1回おきに少し縮小して、ぼけに強くする
        const W = Math.max(1, Math.round(sw * scale)), H = Math.max(1, Math.round(sh * scale));
        canvas.width = W; canvas.height = H;
        ctx.drawImage(video, sx, sy, sw, sh, 0, 0, W, H);
        let text = null;
        if (det) { try { const r = await det.detect(canvas); if (r.length) text = r[0].rawValue; } catch (e) {} }
        if (!text && zx) text = decodeLum(zx, toLum(ctx.getImageData(0, 0, W, H).data, W * H), W, H);
        if (text) onCode(text);
      }
    } catch (e) {}
    // 端末が重いときは間隔をあけて、本体の読み取りを邪魔しない（補助の読み取りが使う時間は最大でも約3分の1）
    fastTimer = setTimeout(loop, Math.max(200, (performance.now() - t0) * 2));
  };
  fastTimer = setTimeout(loop, 400);
}

// 同じ数字を2回読めたときだけ採用する（読み間違いの防止）
const pending = {};
function candidate(raw) {
  let code = String(raw).replace(/\s/g, "");
  if (/^\d{12}$/.test(code)) code = "0" + code;   // UPC-Aで読めた12桁は、13桁のJANとして扱う
  lastReadAt = Date.now();
  if (!validJan(code)) { setStatus("読み間違い（無視）: " + code); return; }
  const now = Date.now();
  for (const k in pending) if (now - pending[k].t > 2000) delete pending[k];
  const p = pending[code] || (pending[code] = { n: 0, t: now });
  p.n++; p.t = now;
  setStatus("読み取り中: " + code);
  if (p.n >= 2) { delete pending[code]; onScan(code, false); }
}

// 手入力
document.getElementById("manualBtn").addEventListener("click", () => {
  const el = document.getElementById("manual");
  const v = el.value.replace(/\s/g, "");
  if (v) { onScan(v, true); el.value = ""; }
});

// カメラ（四角い枠の中のバーコードを読む）
document.getElementById("start").addEventListener("click", async () => {
  if (!window.Html5Qrcode) {
    show("ng", "読込エラー", "読み取り部品を取得できません。電波を確認してください", "");
    return;
  }
  const scanner = new Html5Qrcode("reader", {
    formatsToSupport: [
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A
    ],
    experimentalFeatures: { useBarCodeDetectorIfSupported: true },
    verbose: false
  });
  try {
    await scanner.start(
      { facingMode: "environment" },
      {
        fps: 20,
        disableFlip: true,   // 左右反転での読み直しは不要。その分、読み取り回数を増やす
        qrbox: (w, h) => ({ width: Math.floor(w * 0.92), height: Math.floor(Math.min(h, w) * 0.5) }),
        videoConstraints: {
          facingMode: "environment",
          width: { ideal: 1920 },
          height: { ideal: 1080 },
          advanced: [{ focusMode: "continuous" }]
        }
      },
      (text) => candidate(text),
      () => {
        frames++;
        if (frames % 30 === 0 && Date.now() - lastReadAt > 3000) {
          setStatus("バーコードを探しています…（枠の中に入れてください）");
        }
      }
    );
    setStatus("カメラ起動OK。バーコードを枠の中に入れてください");
    document.getElementById("start").style.display = "none";
    startFastDecoder(candidate);
    // ライトとズーム：対応しているスマホにだけ表示する
    try {
      const caps = scanner.getRunningTrackCameraCapabilities();
      const torch = caps.torchFeature(), zoom = caps.zoomFeature();
      let any = false;
      if (torch.isSupported()) {
        any = true;
        const b = document.getElementById("torchBtn");
        let on = false;
        b.style.display = "";
        b.onclick = async () => { on = !on; await torch.apply(on); b.textContent = on ? "ライトを消す" : "ライト"; };
      }
      if (zoom.isSupported()) {
        any = true;
        const z = document.getElementById("zoom");
        z.min = zoom.min(); z.max = zoom.max(); z.step = zoom.step();
        z.value = zoom.value() || zoom.min();
        z.oninput = () => zoom.apply(parseFloat(z.value));
        document.getElementById("zoomWrap").style.display = "flex";
      }
      if (any) document.getElementById("camTools").style.display = "flex";
    } catch (e) {}
  } catch (e) {
    show("ng", "カメラ不可", "ブラウザのカメラ許可を確認してください", "");
  }
});
</script>
</body>
</html>
